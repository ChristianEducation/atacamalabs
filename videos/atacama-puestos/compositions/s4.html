        const B = 0.6;

        const tl = gsap.timeline({ paused: true });

    tl.fromTo("#c1", { opacity: 0, y: 130, filter: "blur(18px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, A(14.5));
