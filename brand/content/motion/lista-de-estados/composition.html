<!doctype html>
<!--
  Plantilla «lista de estados» (spec §6.6-3) — lenguaje «mini-interfaces»: UN solo elemento que se transforma, un cursor que dispara
  cada cambio y el último frame = el primero (loop sin costura). Ejemplo: formulario de WhatsApp Flows que se completa.
  Contrato del renderer multiformato: ?format=9x16|1x1|16x9 (reencuadre con CSS, no recorte), window.atacamaDuration,
  window.atacamaSeek(t) determinista (sin Date.now ni azar). Perfiles de movimiento: ../perfiles-movimiento.md (resortes sumados).
  Para un video nuevo cambia SOLO el arreglo STATES (textos) y, si hace falta, el perfil; tiempos y cuadrícula quedan.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lista de estados · Atacama Labs</title>
<style>
  @font-face { font-family: "DM Sans"; src: url("assets/DMSans-latin-wght.woff2") format("woff2"); font-weight: 100 1000; }
  :root { --azul: #0F5CED; --tinta: #121A2B; --noche: #041228; --papel: #F5F4F0; --linea: #DDD9D1; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--papel); font-family: "DM Sans", system-ui, sans-serif; color: var(--tinta); }
  .stage { position: absolute; inset: 0; display: grid; place-items: center; }
  .layout { display: grid; gap: 4vmin; align-items: center; justify-items: center; }
  .f-9x16 .layout { grid-template-rows: auto auto; }
  .f-1x1 .layout { grid-template-rows: auto auto; gap: 3vmin; }
  .f-16x9 .layout { grid-template-columns: 1fr 1fr; width: 86vw; justify-items: start; }
  .title { font-weight: 300; line-height: 1.08; letter-spacing: -0.02em; text-align: center; }
  .title b { font-weight: 600; color: var(--azul); }
  .f-9x16 .title { font-size: 7.4vw; max-width: 80vw; }
  .f-1x1 .title { font-size: 5.6vw; max-width: 80vw; }
  .f-16x9 .title { font-size: 4.6vw; text-align: left; max-width: 38vw; }
  .card { position: relative; background: #fff; border: 1px solid var(--linea); border-radius: 3.2vmin; padding: 4vmin; width: 62vmin; box-shadow: 0 1.2vmin 4vmin rgba(4,18,40,.06); }
  .f-9x16 .card { width: 84vw; }
  .f-16x9 .card { justify-self: center; width: 56vmin; }
  .title, .card { will-change: transform, opacity; }
  .head { display: flex; align-items: center; gap: 2vmin; margin-bottom: 3vmin; }
  .head img { width: 6vmin; height: 6vmin; }
  .head span { font-size: 3vmin; font-weight: 500; }
  .row { height: 8vmin; border-radius: 2vmin; border: 1px solid var(--linea); margin-bottom: 2.2vmin; padding: 0 2.6vmin; display: flex; align-items: center; font-size: 3vmin; color: #8a8f99; overflow: hidden; }
  .row .val { color: var(--tinta); font-weight: 500; white-space: nowrap; }
  .btn { height: 8.4vmin; border-radius: 2vmin; background: var(--azul); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 3.1vmin; font-weight: 600; }
  .done { position: absolute; inset: 0; border-radius: 3.2vmin; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vmin; }
  .done .ok { width: 14vmin; height: 14vmin; border-radius: 50%; background: var(--azul); color: #fff; display: grid; place-items: center; font-size: 8vmin; }
  .done p { font-size: 3.4vmin; font-weight: 500; }
  .cursor { position: absolute; left: 0; top: 0; width: 5vmin; height: 5vmin; pointer-events: none; z-index: 5; }
  .ripple { position: absolute; width: 10vmin; height: 10vmin; margin: -5vmin 0 0 -5vmin; border-radius: 50%; border: .5vmin solid var(--azul); opacity: 0; z-index: 4; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="layout">
    <h1 class="title">Tu cliente agenda <b>sin esperar</b> a que alguien conteste</h1>
    <div class="card" id="card">
      <div class="head"><img src="assets/isotipo-azul.svg" alt=""><span>Agenda tu hora</span></div>
      <div class="row" id="r0"><span class="ph">Nombre</span></div>
      <div class="row" id="r1"><span class="ph">Día y hora</span></div>
      <div class="btn" id="btn">Confirmar</div>
      <div class="done" id="done"><div class="ok">✓</div><p>¡Listo! Te esperamos</p></div>
    </div>
  </div>
  <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M3 2l7 19 2.6-7.4L20 11z" fill="#041228" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <div class="ripple" id="ripple"></div>
</div>
<script>
  // ---- Formato (reencuadre, no recorte)
  const fmt = (new URLSearchParams(location.search).get('format') || '9x16').replace(/[^0-9x]/g, '');
  document.body.classList.add('f-' + (['9x16', '1x1', '16x9'].includes(fmt) ? fmt : '9x16'));

  // ---- Perfiles de movimiento (resorte amortiguado; ver perfiles-movimiento.md)
  const PROFILES = { seco: { w: 22, z: 1.0 }, estandar: { w: 14, z: 0.8 }, pesado: { w: 8, z: 0.9 }, jugueton: { w: 16, z: 0.45 } };
  function spring(t, p) {
    if (t <= 0) return 0;
    const { w, z } = p;
    if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
  }
  // Suma de resortes: cada cambio de destino agrega su propio resorte desde ese instante (sin saltos cuando cambia el destino).
  function sumSprings(t, keys, p) { let v = keys[0].v; for (let i = 1; i < keys.length; i++) v += (keys[i].v - keys[i - 1].v) * spring(t - keys[i].t, p); return v; }

  // ---- Línea de tiempo (6 s; el último frame vuelve al primero)
  const DUR = 6.0, P = PROFILES.estandar, PC = PROFILES.seco;
  const STATES = [
    { at: 1.0, row: 0, text: 'Camila Rojas' },
    { at: 2.1, row: 1, text: 'Jueves 10:30' },
    { at: 3.2, done: true },
  ];
  window.atacamaDuration = DUR;
  const $ = (id) => document.getElementById(id);
  function targets() {
    const st = $('stage').getBoundingClientRect();
    const c = (el) => { const r = el.getBoundingClientRect(); return { x: r.left - st.left + r.width * 0.7, y: r.top - st.top + r.height * 0.6 }; };
    const card = $('card').getBoundingClientRect();
    return { rest: { x: card.right - st.left - card.width * 0.12, y: card.bottom - st.top + Math.min(card.height * 0.18, (st.height - card.bottom + st.top) * 0.5) }, r0: c($('r0')), r1: c($('r1')), btn: c($('btn')) };
  }
  window.atacamaSeek = function (t) {
    t = Math.max(0, Math.min(DUR, Number(t) || 0));
    const T = targets();
    // cursor: reposo → campo 1 → campo 2 → botón → reposo (destinos sumados con perfil seco)
    const path = [{ t: 0, p: T.rest }, { t: 0.35, p: T.r0 }, { t: 1.45, p: T.r1 }, { t: 2.55, p: T.btn }, { t: 3.9, p: T.rest }];
    const cx = sumSprings(t, path.map((k) => ({ t: k.t, v: k.p.x })), PC), cy = sumSprings(t, path.map((k) => ({ t: k.t, v: k.p.y })), PC);
    $('cursor').style.transform = `translate(${cx}px, ${cy}px)`;
    // clic: onda en cada cambio de estado
    const clicks = STATES.map((s) => s.at);
    const last = clicks.filter((c) => c <= t).pop();
    const k = last != null ? (t - last) / 0.35 : 1;
    $('ripple').style.opacity = k < 1 ? String(0.8 * (1 - k)) : '0';
    $('ripple').style.transform = `translate(${cx}px, ${cy}px) scale(${0.4 + 0.8 * Math.min(1, k)})`;
    // estados: el MISMO elemento se transforma
    [0, 1].forEach((i) => {
      const s = STATES.find((x) => x.row === i);
      const on = spring(t - s.at, P) * (1 - spring(t - 4.6, P));
      const row = $('r' + i);
      const chars = Math.round(s.text.length * Math.max(0, Math.min(1, (t - s.at) / 0.5))) * (t < 4.6 ? 1 : 0);
      row.innerHTML = chars > 0 ? '<span class="val">' + s.text.slice(0, chars) + '</span>' : '<span class="ph">' + (i ? 'Día y hora' : 'Nombre') + '</span>';
      row.style.borderColor = on > 0.5 ? 'var(--azul)' : 'var(--linea)';
    });
    const d = spring(t - 3.2, P) * (1 - spring(t - 4.9, PROFILES.estandar));
    $('done').style.opacity = d > 0.5 ? '1' : String(Math.max(0, Math.min(1, d * 2)) * 0);
    $('done').style.visibility = d > 0.5 ? 'visible' : 'hidden';
    $('done').style.transform = `scale(${0.92 + 0.08 * Math.max(0, Math.min(1.1, d))})`;
    const inT = spring(t - 0.0, PROFILES.jugueton) * (1 - spring(t - 5.45, PROFILES.seco)), inC = spring(t - 0.12, P) * (1 - spring(t - 5.5, PROFILES.seco));
    $('stage').querySelector('.title').style.transform = `translateY(${(1 - inT) * 6}vmin)`; $('stage').querySelector('.title').style.opacity = String(Math.max(0, Math.min(1, inT * 1.4)));
    $('card').style.transform = `translateY(${(1 - inC) * 8}vmin) scale(${0.94 + 0.06 * inC})`; $('card').style.opacity = String(Math.max(0, Math.min(1, inC * 1.4)));
    $('btn').style.transform = `scale(${1 - 0.04 * Math.max(0, 1 - Math.abs(t - 3.2) / 0.15)})`;
  };
  window.atacamaSeek(0);
</script>
</body>
</html>
