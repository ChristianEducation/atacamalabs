<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:"DM Sans";src:url("__FONT__") format("woff2");font-weight:100 1000}
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#0f5ced;--ink:#0b1e3f}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f3f6fd}
body{font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
#st{position:absolute;inset:0;overflow:hidden;background:#f3f6fd}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(15,92,237,.10) 2px,transparent 2px),linear-gradient(90deg,rgba(15,92,237,.10) 2px,transparent 2px);background-size:120px 120px}
#glow{position:absolute;left:100px;top:700px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(88,166,255,.30),rgba(88,166,255,0) 66%)}
.h{position:absolute;left:90px;top:230px;width:900px;font-size:96px;font-weight:700;letter-spacing:-.04em;line-height:1.03}
.h .w{display:inline-block;opacity:0;white-space:pre}.h em{font-style:normal;color:var(--blue)}
.m{position:absolute;max-width:720px;font-size:40px;line-height:1.22;font-weight:500;padding:26px 34px;border-radius:40px;opacity:0;letter-spacing:-.01em}
.m.a{left:90px;background:var(--blue);color:#fff;border-bottom-left-radius:10px;box-shadow:0 18px 40px rgba(15,92,237,.30)}
.m.p{right:90px;background:#fff;border:3px solid #d5e0f6;border-bottom-right-radius:10px;box-shadow:0 14px 34px rgba(26,60,142,.12)}
.who{position:absolute;font-size:24px;font-weight:700;letter-spacing:.12em;opacity:0}
#chip{position:absolute;left:90px;top:1500px;display:flex;gap:18px;opacity:0}
#chip span{background:#fff;border:3px solid #d5e0f6;color:var(--blue);font-weight:700;font-size:34px;padding:14px 30px;border-radius:50px;box-shadow:0 12px 28px rgba(26,60,142,.12)}
#chip span.ok{background:var(--blue);border-color:var(--blue);color:#fff}
#logo{position:absolute;left:50%;top:1680px;width:400px;transform:translateX(-50%);opacity:0}
</style></head><body><div id="st"><div class="grid" id="g"></div><div id="glow"></div>
<div class="h" id="h"><span class="w">Se </span><span class="w">arregla </span><span class="w"><em>antes,</em></span><br><span class="w">no </span><span class="w"><em>después.</em></span></div>
<div class="m a" id="m1" style="top:560px">Hola Camila, mañana a las 16:30 tienes hora en la clínica. ¿Confirmas?</div>
<div class="m p" id="m2" style="top:800px">Uy, no voy a poder.</div>
<div class="m a" id="m3" style="top:960px">Sin problema. Tengo jueves 17:00 o viernes 10:30. ¿Cuál prefieres?</div>
<div class="m p" id="m4" style="top:1210px">Jueves 17:00.</div>
<div class="m a" id="m5" style="top:1340px">Listo, tu hora quedó reprogramada.</div>
<div id="chip"><span class="ok">Hora reprogramada</span><span>Agenda actualizada</span></div>
<img id="logo" src="__LOGO__">
</div><script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (T, a, b) => clamp((T - a) / (b - a));
const eout = (t) => 1 - Math.pow(1 - t, 3);
const back = (t, s = 1.7) => { t = clamp(t); const c3 = s + 1; return 1 + c3 * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
function bg(T) { $('g').style.backgroundPosition = (T * 10) + 'px ' + (-T * 8) + 'px'; $('glow').style.transform = 'translate(' + (Math.sin(T * 0.8) * 30) + 'px,' + (Math.cos(T * 0.8) * 24) + 'px)'; }
function words(T, step) { Array.from($('h').querySelectorAll('.w')).forEach((w, i) => { const u = seg(T, 0.15 + i * step, 0.15 + i * step + 0.45), s = back(u, 1.6); w.style.opacity = clamp(u * 2.5); w.style.transform = 'translateY(' + ((1 - s) * 44) + 'px)'; w.style.filter = u < 1 ? 'blur(' + ((1 - u) * 8) + 'px)' : 'none'; }); }
function draw(T) {
  bg(T); words(T, 0.13);
  [['m1', 1.0, -1], ['m2', 2.0, 1], ['m3', 3.0, -1], ['m4', 4.1, 1], ['m5', 5.0, -1]].forEach(([id, t0, dir]) => { const u = back(seg(T, t0, t0 + 0.5), 1.5); const el = $(id); el.style.opacity = clamp(u * 3); el.style.transform = 'translateX(' + ((1 - u) * 120 * dir) + 'px) scale(' + (0.92 + 0.08 * u) + ')'; });
  const c = back(seg(T, 5.9, 6.5), 1.6); $('chip').style.opacity = clamp(c * 3); $('chip').style.transform = 'translateY(' + ((1 - c) * 40) + 'px)';
  const lg = back(seg(T, 6.8, 7.4), 1.5); $('logo').style.opacity = clamp(lg * 3); $('logo').style.transform = 'translateX(-50%) translateY(' + ((1 - lg) * 40) + 'px)';
}
window.draw = draw;
</script></body></html>
