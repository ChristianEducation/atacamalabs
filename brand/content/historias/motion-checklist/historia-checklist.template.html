<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:"DM Sans";src:url("__FONT__") format("woff2");font-weight:100 1000}
*{margin:0;padding:0;box-sizing:border-box}
:root{--real:#1a3c8e;--blue:#0f5ced;--sky:#58a6ff;--mist:#f3f6fd;--ink:#0b1e3f}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f3f6fd}
body{font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
#st{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--mist)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(15,92,237,.10) 2px,transparent 2px),linear-gradient(90deg,rgba(15,92,237,.10) 2px,transparent 2px);background-size:120px 120px}
#top{position:absolute;left:0;top:-620px;width:1080px;height:620px;background:var(--real);overflow:hidden}
#top .grid{background-image:linear-gradient(rgba(255,255,255,.13) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.13) 2px,transparent 2px)}
#glow{position:absolute;left:-200px;top:-200px;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(88,166,255,.45),rgba(88,166,255,0) 70%)}
.h{position:absolute;left:90px;top:262px;width:900px;font-size:88px;font-weight:500;letter-spacing:-.032em;line-height:1.04;color:#fff}
.h em{font-style:normal;color:var(--sky)}.h .w{display:inline-block;opacity:0;white-space:pre}
#sub{position:absolute;left:90px;top:470px;width:900px;font-size:36px;font-weight:400;color:#dbe6ff;opacity:0}
#card{position:absolute;left:90px;top:700px;width:900px;height:650px;border-radius:56px;background:#fff;border:3px solid #d5e0f6;box-shadow:0 30px 70px rgba(5,18,60,.22);opacity:0}
#card .tt{position:absolute;left:54px;top:40px;font-size:26px;font-weight:700;letter-spacing:.14em;color:var(--blue)}
.row{position:absolute;left:54px;width:792px;height:84px;display:flex;align-items:center;gap:26px;opacity:0}
.row .n{width:54px;height:54px;border-radius:50%;border:5px solid #c7d6f2;background:#fff;color:#8aa0cf;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.row .t{font-size:44px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.row .ln{position:absolute;left:0;right:0;bottom:-10px;height:2px;background:#e7eefb}
.row.on .n{background:var(--blue);border-color:var(--blue);color:#fff}
#sweep{position:absolute;top:0;bottom:0;width:260px;left:-300px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(88,166,255,.25),rgba(255,255,255,0));opacity:0}
#pill{position:absolute;left:50%;top:1412px;transform:translateX(-50%);background:var(--blue);color:#fff;font-weight:600;font-size:41px;white-space:nowrap;padding:24px 54px;border-radius:70px;box-shadow:0 14px 34px rgba(15,92,237,.35);opacity:0}
#bd{position:absolute;left:110px;width:860px;top:1522px;font-size:38px;text-align:center;line-height:1.3;opacity:0}
#bd b{font-weight:600}
#logo{position:absolute;left:50%;top:1470px;width:700px;transform:translateX(-50%);opacity:0}
#url{position:absolute;left:0;width:100%;top:1640px;text-align:center;font-size:32px;font-weight:500;color:var(--blue);letter-spacing:.14em;opacity:0}
</style></head><body><div id="st">
<div class="grid" id="g0"></div>
<div id="top"><div class="grid" id="g1"></div><div id="glow"></div>
 <div class="h" id="h"><span class="w">Antes de </span><span class="w">automatizar,</span><br><span class="w"><em>elige bien.</em></span></div>
 <div id="sub">5 preguntas para saber por qué proceso partir.</div>
</div>
<div id="card"><div class="tt">CHECKLIST · 10 MINUTOS</div><div id="sweep"></div></div>
<img id="logo" src="__LOGO__"><div id="url">ATACAMALABS.CL</div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (T, a, b) => clamp((T - a) / (b - a));
const eout = (t) => 1 - Math.pow(1 - t, 3);
const back = (t, s = 1.7) => { t = clamp(t); const c3 = s + 1; return 1 + c3 * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const ROWS = ['Se repite', 'Tiene reglas claras', 'Mueves datos a mano', 'Cuesta tiempo o genera errores', 'Se puede medir y revisar'];
const rows = ROWS.map((t, i) => { const d = document.createElement('div'); d.className = 'row'; d.style.top = (110 + i * 104) + 'px'; d.innerHTML = '<div class="n">' + (i + 1) + '</div><div class="t">' + t + '</div>' + (i < 4 ? '<div class="ln"></div>' : ''); $('card').append(d); return d; });
const CHECK = '<svg viewBox="0 0 52 52" width="40" height="40" style="position:absolute;left:3px;top:3px"><path d="M14 27 L23 36 L39 17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="40" stroke-dashoffset="__OFF__"/></svg>';
function draw(T) {
  // panel azul: baja desde arriba; la cuadrícula y el brillo se mueven suavemente
  const tu = back(seg(T, 0.0, 0.7), 1.2); $('top').style.top = (-620 + 620 * tu) + 'px';
  $('g1').style.backgroundPosition = (-T * 14) + 'px ' + (T * 10) + 'px'; $('g0').style.backgroundPosition = (T * 8) + 'px ' + (-T * 6) + 'px';
  $('glow').style.transform = 'translate(' + (T * 36) + 'px,' + (T * 14) + 'px)';
  Array.from($('h').querySelectorAll('.w')).forEach((w, i) => { const u = seg(T, 0.45 + i * 0.22, 0.45 + i * 0.22 + 0.5), s = back(u, 1.6); w.style.opacity = clamp(u * 2.5); w.style.transform = 'translateY(' + ((1 - s) * 44) + 'px)'; w.style.filter = u < 1 ? 'blur(' + ((1 - u) * 8) + 'px)' : 'none'; });
  $('sub').style.opacity = eout(seg(T, 1.3, 1.8));
  // tarjeta
  const card = $('card'); const cu = back(seg(T, 1.2, 1.9), 1.5); card.style.opacity = clamp(cu * 3); card.style.transform = 'translateY(' + ((1 - cu) * 140) + 'px) scale(' + (0.94 + 0.06 * cu) + ')';
  rows.forEach((r, i) => {
    const t0 = 2.0 + i * 0.7; const u = seg(T, t0, t0 + 0.4), s = back(u, 1.6);
    r.style.opacity = clamp(u * 3); r.style.transform = 'translateX(' + ((1 - s) * 80) + 'px)';
    const k = seg(T, t0 + 0.35, t0 + 0.7); const on = k > 0.02; r.className = 'row' + (on ? ' on' : '');
    const n = r.querySelector('.n'); n.innerHTML = on ? CHECK.replace('__OFF__', String(40 * (1 - eout(k)))) : String(i + 1);
    n.style.transform = 'scale(' + (on ? 1 + 0.32 * Math.sin(k * Math.PI) : 1) + ')';
    n.style.boxShadow = on && k < 1 ? '0 0 0 ' + (18 * k) + 'px rgba(15,92,237,' + (0.28 * (1 - k)) + ')' : 'none';
  });
  // destello que barre la tarjeta al completar el quinto punto
  const sw = seg(T, 5.55, 6.3); $('sweep').style.opacity = sw > 0 && sw < 1 ? 1 : 0; $('sweep').style.left = (-300 + 1500 * sw) + 'px';
  // cierre
  const lu = back(seg(T, 5.9, 6.6), 1.5); $('logo').style.opacity = clamp(lu * 3); $('logo').style.transform = 'translateX(-50%) translateY(' + ((1 - lu) * 40) + 'px) scale(' + (0.9 + 0.1 * lu) + ')'; $('url').style.opacity = eout(seg(T, 6.4, 6.9));
}
window.draw = draw;
</script></body></html>
