const els = CARDS.map((c) => {
  const d = document.createElement('div'); d.className = 'card'; d.style.top = c.top + 'px'; d.style.width = c.w + 'px'; d.style.background = c.bg; d.style.color = c.ink;
  d.innerHTML = '<div class="nm">' + c.nm + '</div><div class="sb">' + c.sb + '</div><div class="dots">' + Array.from({ length: c.n }, () => '<div class="dot"></div>').join('') + '</div>' + (c.tag ? '<div class="tag">' + c.tag + '</div>' : '');
  $('st').insertBefore(d, $('pill')); return d;
});
function draw(T) {
  const tu = back(seg(T, 0.0, 0.7), 1.2); $('top').style.top = (-560 + 560 * tu) + 'px';
  $('g1').style.backgroundPosition = (-T * 14) + 'px ' + (T * 10) + 'px'; $('g0').style.backgroundPosition = (T * 8) + 'px ' + (-T * 6) + 'px';
  $('glow').style.transform = 'translate(' + (T * 36) + 'px,' + (T * 14) + 'px)';
  Array.from($('h').querySelectorAll('.w')).forEach((w, i) => { const u = seg(T, 0.45 + i * 0.17, 0.45 + i * 0.17 + 0.5), s = back(u, 1.6); w.style.opacity = clamp(u * 2.5); w.style.transform = 'translateY(' + ((1 - s) * 44) + 'px)'; w.style.filter = u < 1 ? 'blur(' + ((1 - u) * 8) + 'px)' : 'none'; });
  els.forEach((el, i) => {
    const t0 = 1.7 + i * 0.7; const u = seg(T, t0, t0 + 0.65), s = back(u, 1.5);
    const fl = T > t0 + 0.9 ? Math.sin((T - t0) * 2.4 + i) * 4 : 0;
    el.style.opacity = clamp(u * 3); el.style.transform = 'translateY(' + ((1 - s) * 280 + fl) + 'px) scale(' + (0.92 + 0.08 * s) + ')';
    Array.from(el.querySelectorAll('.dot')).forEach((d, j) => { const k = back(seg(T, t0 + 0.5 + j * 0.13, t0 + 0.5 + j * 0.13 + 0.35), 2.2); d.style.opacity = clamp(k * 3); d.style.transform = 'scale(' + k + ')'; });
    const tg = el.querySelector('.tag'); if (tg) { const k = back(seg(T, t0 + 0.9, t0 + 1.4), 2.4); tg.style.opacity = clamp(k * 3); tg.style.transform = 'scale(' + (0.5 + 0.5 * k) + ') rotate(' + ((1 - k) * -10) + 'deg)'; }
  });
  const pu = back(seg(T, 4.5, 5.2), 1.8); $('pill').style.opacity = clamp(pu * 3); $('pill').style.transform = 'translateX(-50%) translateY(' + ((1 - pu) * 40) + 'px) scale(' + (0.85 + 0.15 * pu) + ')';
  const lu = back(seg(T, 5.4, 6.1), 1.5); $('logo').style.opacity = clamp(lu * 3); $('logo').style.transform = 'translateX(-50%) translateY(' + ((1 - lu) * 40) + 'px) scale(' + (0.9 + 0.1 * lu) + ')';
}
window.draw = draw;
</script></body></html>
