<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:"DM Sans";src:url("__FONT__") format("woff2");font-weight:100 1000}
*{margin:0;padding:0;box-sizing:border-box}
:root{--real:#1a3c8e;--blue:#0f5ced;--sky:#58a6ff;--mist:#f3f6fd;--ink:#0b1e3f}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f3f6fd}
body{font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
#st{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--mist)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(15,92,237,.10) 2px,transparent 2px),linear-gradient(90deg,rgba(15,92,237,.10) 2px,transparent 2px);background-size:120px 120px}
#top{position:absolute;left:0;top:-600px;width:1080px;height:600px;background:var(--real);overflow:hidden}
#top .grid{background-image:linear-gradient(rgba(255,255,255,.13) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.13) 2px,transparent 2px)}
#glow{position:absolute;left:-200px;top:-200px;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(88,166,255,.45),rgba(88,166,255,0) 70%)}
.h{position:absolute;left:90px;top:262px;width:900px;font-size:88px;font-weight:600;letter-spacing:-.032em;line-height:1.04;color:#fff}
.h em{font-style:normal;color:var(--sky)}.h .w{display:inline-block;opacity:0;white-space:pre}
#card{position:absolute;left:90px;top:700px;width:900px;height:640px;border-radius:56px;background:#fff;border:3px solid #d5e0f6;box-shadow:0 30px 70px rgba(5,18,60,.22);opacity:0;overflow:hidden}
.row{position:absolute;left:50px;width:800px;height:100px;display:flex;align-items:center;gap:30px;opacity:0}
.row .n{width:84px;height:84px;border-radius:50%;border:6px solid #c7d6f2;background:#fff;flex:none;position:relative}
.row .t{font-size:48px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
#sweep{position:absolute;top:0;bottom:0;width:260px;left:-300px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(88,166,255,.25),rgba(255,255,255,0));opacity:0}
#t1{position:absolute;left:0;width:100%;top:1420px;text-align:center;font-size:38px;color:#5f7094;opacity:0}
#t2{position:absolute;left:0;width:100%;top:1470px;text-align:center;font-size:60px;font-weight:700;letter-spacing:-.01em;color:var(--blue);opacity:0}
#logo{position:absolute;left:50%;top:1678px;width:420px;transform:translateX(-50%);opacity:0}
</style></head><body><div id="st">
<div class="grid" id="g0"></div>
<div id="top"><div class="grid" id="g1"></div><div id="glow"></div>
 <div class="h" id="h"><span class="w">Mientras </span><span class="w">tú </span><span class="w">vendes,</span><br><span class="w"><em>tu agente trabaja.</em></span></div>
</div>
<div id="card"><div id="sweep"></div></div>
<div id="t1">Mira los planes en</div><div id="t2">atacamalabs.cl/precios</div>
<img id="logo" src="__LOGO__">
</div>
<script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (T, a, b) => clamp((T - a) / (b - a));
const eout = (t) => 1 - Math.pow(1 - t, 3);
const back = (t, s = 1.7) => { t = clamp(t); const c3 = s + 1; return 1 + c3 * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const ROWS = [['Responde a cada consulta', '#0f5ced'], ['Agenda la visita o la hora', '#00a99b'], ['Hace el seguimiento', '#f5a524'], ['Te avisa cuando hay interés', '#ff7a59']];
const rows = ROWS.map(([t, c], i) => { const d = document.createElement('div'); d.className = 'row'; d.style.top = (50 + i * 142) + 'px'; d.innerHTML = '<div class="n"></div><div class="t">' + t + '</div>'; $('card').append(d); return d; });
const CHECK = '<svg viewBox="0 0 52 52" width="46" height="46" style="position:absolute;left:11px;top:11px"><path d="M14 27 L23 36 L39 17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="40" stroke-dashoffset="__OFF__"/></svg>';
function draw(T) {
  const tu = back(seg(T, 0.0, 0.7), 1.2); $('top').style.top = (-600 + 600 * tu) + 'px';
  $('g1').style.backgroundPosition = (-T * 14) + 'px ' + (T * 10) + 'px'; $('g0').style.backgroundPosition = (T * 8) + 'px ' + (-T * 6) + 'px';
  $('glow').style.transform = 'translate(' + (T * 36) + 'px,' + (T * 14) + 'px)';
  Array.from($('h').querySelectorAll('.w')).forEach((w, i) => { const u = seg(T, 0.45 + i * 0.2, 0.45 + i * 0.2 + 0.5), s = back(u, 1.6); w.style.opacity = clamp(u * 2.5); w.style.transform = 'translateY(' + ((1 - s) * 44) + 'px)'; w.style.filter = u < 1 ? 'blur(' + ((1 - u) * 8) + 'px)' : 'none'; });
  const cu = back(seg(T, 1.3, 2.0), 1.5); const card = $('card'); card.style.opacity = clamp(cu * 3); card.style.transform = 'translateY(' + ((1 - cu) * 140) + 'px) scale(' + (0.94 + 0.06 * cu) + ')';
  rows.forEach((r, i) => {
    const t0 = 2.1 + i * 0.85; const u = seg(T, t0, t0 + 0.4), s = back(u, 1.6);
    r.style.opacity = clamp(u * 3); r.style.transform = 'translateX(' + ((1 - s) * 80) + 'px)';
    const k = seg(T, t0 + 0.35, t0 + 0.7); const on = k > 0.02; const n = r.querySelector('.n'); const col = ROWS[i][1];
    n.style.background = on ? col : '#fff'; n.style.borderColor = on ? col : '#c7d6f2';
    n.innerHTML = on ? CHECK.replace('__OFF__', String(40 * (1 - eout(k)))) : '';
    n.style.transform = 'scale(' + (on ? 1 + 0.3 * Math.sin(k * Math.PI) : 1) + ')';
    n.style.boxShadow = on && k < 1 ? '0 0 0 ' + (20 * k) + 'px ' + col + Math.round(70 * (1 - k)).toString(16).padStart(2, '0') : 'none';
  });
  const sw = seg(T, 5.55, 6.3); $('sweep').style.opacity = sw > 0 && sw < 1 ? 1 : 0; $('sweep').style.left = (-300 + 1500 * sw) + 'px';
  $('t1').style.opacity = eout(seg(T, 5.7, 6.1));
  const p = back(seg(T, 5.9, 6.55), 1.8); $('t2').style.opacity = clamp(p * 3); $('t2').style.transform = 'scale(' + (0.85 + 0.15 * p) + ')';
  const lu = back(seg(T, 6.4, 7.1), 1.5); $('logo').style.opacity = clamp(lu * 3); $('logo').style.transform = 'translateX(-50%) translateY(' + ((1 - lu) * 40) + 'px) scale(' + (0.9 + 0.1 * lu) + ')';
}
window.draw = draw;
</script></body></html>
