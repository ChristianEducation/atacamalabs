<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:"DM Sans";src:url("__FONT__") format("woff2");font-weight:100 1000}
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#0f5ced;--mist:#f3f6fd;--ink:#0b1e3f;--amber:#ffc53d;--teal:#00a99b;--coral:#ff7a59}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f3f6fd}
body{font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
#st{position:absolute;inset:0;overflow:hidden;background:var(--mist)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(15,92,237,.10) 2px,transparent 2px),linear-gradient(90deg,rgba(15,92,237,.10) 2px,transparent 2px);background-size:120px 120px}
#glow{position:absolute;left:100px;top:600px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(88,166,255,.30),rgba(88,166,255,0) 66%)}
#lab{position:absolute;left:90px;top:310px;background:var(--amber);color:#10224f;font-weight:700;font-size:32px;letter-spacing:.12em;padding:14px 30px;border-radius:50px;opacity:0}
.card{position:absolute;left:90px;width:900px;border-radius:48px;background:#fff;padding:60px 54px 54px;box-shadow:0 26px 60px rgba(26,60,142,.16);opacity:0}
.tag{position:absolute;left:54px;top:-26px;color:#fff;font-weight:700;font-size:34px;letter-spacing:.12em;padding:10px 30px;border-radius:40px}
#m{top:470px;border:6px solid var(--coral)}#m .tag{background:var(--coral)}
#r{top:960px;border:6px solid var(--teal)}#r .tag{background:var(--teal)}
.tx{position:relative;font-size:80px;font-weight:700;letter-spacing:-.03em;line-height:1.08}
#r .tx{font-size:66px}
#strike{position:absolute;left:-10px;top:48%;height:10px;width:0;background:var(--coral);border-radius:6px;transform:rotate(-2deg);transform-origin:0 50%}
#ck{position:absolute;right:46px;top:-34px;width:96px;height:96px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;opacity:0;box-shadow:0 12px 30px rgba(0,169,155,.4)}
#logo{position:absolute;left:50%;top:1500px;width:540px;transform:translateX(-50%);opacity:0}
#url{position:absolute;left:0;width:100%;top:1650px;text-align:center;font-size:32px;font-weight:600;color:var(--blue);letter-spacing:.16em;opacity:0}
</style></head><body><div id="st"><div class="grid" id="g"></div><div id="glow"></div>
<div id="lab">MITO VS. REALIDAD</div>
<div class="card" id="m"><div class="tag">MITO</div><div class="tx" id="mt">Un agente reemplaza a tu equipo.<div id="strike"></div></div></div>
<div class="card" id="r"><div class="tag">REALIDAD</div><div id="ck"><svg viewBox="0 0 52 52" width="62" height="62"><path d="M14 27 L23 36 L39 17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="tx">Hace lo repetitivo y <span style="color:var(--blue)">pasa a una persona lo importante.</span></div></div>
<img id="logo" src="__LOGO__"><div id="url">ATACAMALABS.CL</div>
</div><script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (T, a, b) => clamp((T - a) / (b - a));
const eout = (t) => 1 - Math.pow(1 - t, 3);
const back = (t, s = 1.7) => { t = clamp(t); const c3 = s + 1; return 1 + c3 * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
function draw(T) {
  $('g').style.backgroundPosition = (T * 10) + 'px ' + (-T * 8) + 'px';
  $('glow').style.transform = 'translate(' + (Math.sin(T * 0.8) * 30) + 'px,' + (Math.cos(T * 0.8) * 24) + 'px)';
  const l = back(seg(T, 0.1, 0.6), 1.8); $('lab').style.opacity = clamp(l * 3); $('lab').style.transform = 'scale(' + (0.7 + 0.3 * l) + ')';
  const m = back(seg(T, 0.5, 1.2), 1.5); const dim = eout(seg(T, 2.3, 2.7));
  $('m').style.opacity = clamp(m * 3) * (1 - 0.45 * dim); $('m').style.transform = 'translateX(' + ((1 - m) * -160) + 'px) scale(' + (0.96 + 0.04 * m - 0.03 * dim) + ')';
  $('strike').style.width = (eout(seg(T, 1.7, 2.3)) * 108) + '%';
  const r = back(seg(T, 2.7, 3.45), 1.6); $('r').style.opacity = clamp(r * 3); $('r').style.transform = 'translateX(' + ((1 - r) * 160) + 'px) rotate(' + ((1 - r) * 3) + 'deg)';
  const ck = back(seg(T, 3.5, 4.0), 2.4); $('ck').style.opacity = clamp(ck * 3); $('ck').style.transform = 'scale(' + ck + ')';
  const lg = back(seg(T, 4.7, 5.4), 1.5); $('logo').style.opacity = clamp(lg * 3); $('logo').style.transform = 'translateX(-50%) translateY(' + ((1 - lg) * 40) + 'px) scale(' + (0.9 + 0.1 * lg) + ')';
  $('url').style.opacity = eout(seg(T, 5.3, 5.8));
}
window.draw = draw;
</script></body></html>
