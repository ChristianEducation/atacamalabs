<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:"DM Sans";src:url("__FONT__") format("woff2");font-weight:100 1000}
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#0f5ced;--mist:#f3f6fd;--ink:#0b1e3f;--amber:#ffc53d;--teal:#00a99b;--grey:#c7d6f2}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f3f6fd}
body{font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
#st{position:absolute;inset:0;overflow:hidden;background:var(--mist)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(15,92,237,.10) 2px,transparent 2px),linear-gradient(90deg,rgba(15,92,237,.10) 2px,transparent 2px);background-size:120px 120px}
#glow{position:absolute;left:100px;top:700px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(88,166,255,.30),rgba(88,166,255,0) 66%)}
.h{position:absolute;left:90px;top:300px;width:900px;font-size:110px;font-weight:700;letter-spacing:-.035em;line-height:1.02}
.h .w{display:inline-block;opacity:0;white-space:pre}
#msg{position:absolute;left:90px;top:560px;width:900px;background:#fff;border:3px solid #d5e0f6;border-radius:44px;padding:30px 38px;box-shadow:0 26px 60px rgba(26,60,142,.16);opacity:0}
#msg .hd{display:flex;align-items:center;gap:20px;margin-bottom:18px}#msg .nm{font-size:30px;font-weight:600;color:#5f7094;flex:1}#msg .tm{font-size:28px;color:#8a99b8}
#msg .bb{background:#f1f5fd;border-radius:30px 30px 30px 8px;padding:22px 30px;font-size:42px;line-height:1.25;font-weight:500;display:inline-block}
.card{position:absolute;left:90px;width:900px;height:175px;border-radius:44px;background:#fff;border:5px solid var(--grey);display:flex;align-items:center;gap:34px;padding:0 44px;opacity:0;box-shadow:0 22px 50px rgba(26,60,142,.12)}
.card .ic{width:100px;height:100px;border-radius:50%;flex:none;background:var(--grey);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:62px}
.card .t{font-size:60px;font-weight:700;letter-spacing:-.02em}.card .s{font-size:34px;color:#5f7094;margin-top:4px}
#q{position:absolute;left:90px;width:900px;top:1330px;font-size:104px;font-weight:700;letter-spacing:-.035em;line-height:1.02;color:var(--blue);opacity:0}
#logo{position:absolute;left:50%;top:1670px;width:420px;transform:translateX(-50%);opacity:0}
</style></head><body><div id="st"><div class="grid" id="g"></div><div id="glow"></div>
<div class="h" id="h"><span class="w">El </span><span class="w">pedido </span><span class="w">llegó.</span></div>
<div id="msg"><div class="hd"><svg viewBox="0 0 48 48" width="76" height="76"><rect width="48" height="48" rx="12" fill="#25d366"/><circle cx="24" cy="23" r="12" fill="none" stroke="#fff" stroke-width="3"/><path d="M13 37l3-7 5 4z" fill="#fff"/><path d="M19.5 18.5c0 5 4.5 9.5 9.5 9.5l1.8-2.3-3.2-1.6-1.4 1.2c-1.6-.7-3.3-2.4-4-4l1.2-1.4-1.6-3.2z" fill="#fff"/></svg><div class="nm">Cliente · Pedido de almuerzos</div><div class="tm">13:05</div></div><div class="bb">Hola, ¿pueden dejar listos 2 almuerzos para mañana al mediodía?</div></div>
<div class="card" id="c1" style="top:900px"><div class="ic" id="i1"></div><div><div class="t">Recibido</div><div class="s">El mensaje llegó al WhatsApp</div></div></div>
<div class="card" id="c2" style="top:1100px"><div class="ic" id="i2"></div><div><div class="t">Confirmado</div><div class="s">¿Alguien tomó el pedido?</div></div></div>
<div id="q">¿Pero alguien lo confirmó?</div>
<img id="logo" src="__LOGO__">
</div><script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (T, a, b) => clamp((T - a) / (b - a));
const eout = (t) => 1 - Math.pow(1 - t, 3);
const back = (t, s = 1.7) => { t = clamp(t); const c3 = s + 1; return 1 + c3 * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const CK = (off) => '<svg viewBox="0 0 52 52" width="64" height="64"><path d="M14 27 L23 36 L39 17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="40" stroke-dashoffset="' + off + '"/></svg>';
function draw(T) {
  $('g').style.backgroundPosition = (T * 10) + 'px ' + (-T * 8) + 'px';
  $('glow').style.transform = 'translate(' + (Math.sin(T * 0.8) * 30) + 'px,' + (Math.cos(T * 0.8) * 24) + 'px)';
  Array.from($('h').querySelectorAll('.w')).forEach((w, i) => { const u = seg(T, 0.15 + i * 0.16, 0.15 + i * 0.16 + 0.45), s = back(u, 1.6); w.style.opacity = clamp(u * 2.5); w.style.transform = 'translateY(' + ((1 - s) * 44) + 'px)'; w.style.filter = u < 1 ? 'blur(' + ((1 - u) * 8) + 'px)' : 'none'; });
  const m = back(seg(T, 0.7, 1.35), 1.5); $('msg').style.opacity = clamp(m * 3); $('msg').style.transform = 'translateY(' + ((1 - m) * 70) + 'px) scale(' + (0.92 + 0.08 * m) + ')';
  [['c1', 1.6], ['c2', 2.0]].forEach(([id, t0]) => { const u = back(seg(T, t0, t0 + 0.5), 1.5); $(id).style.opacity = clamp(u * 3); $(id).style.transform = 'translateX(' + ((1 - u) * 140) + 'px)'; });
  const k1 = seg(T, 2.05, 2.5); $('i1').style.background = k1 > 0 ? 'var(--teal)' : 'var(--grey)'; $('i1').innerHTML = k1 > 0 ? CK(40 * (1 - eout(k1))) : ''; $('c1').style.borderColor = k1 > 0 ? 'var(--teal)' : 'var(--grey)';
  $('i2').style.background = T > 2.5 ? 'var(--amber)' : 'var(--grey)'; $('i2').innerHTML = T > 2.5 ? '?' : ''; $('c2').style.borderColor = T > 2.5 ? 'var(--amber)' : 'var(--grey)';
  $('i2').style.transform = 'scale(' + (T > 2.7 ? 1 + 0.07 * Math.sin((T - 2.7) * 8) : 1) + ')';
  const wig = (T > 3.4 && T < 4.6) ? Math.sin((T - 3.4) * 26) * 2 : 0; $('c2').style.transform = $('c2').style.transform.split(' rotate')[0] + ' rotate(' + wig + 'deg)';
  const q = back(seg(T, 3.3, 3.95), 1.8); $('q').style.opacity = clamp(q * 3); $('q').style.transform = 'translateY(' + ((1 - q) * 50) + 'px) scale(' + ((0.9 + 0.1 * q) * (T > 4.0 ? 1 + 0.02 * Math.sin((T - 4.0) * 5) : 1)) + ')';
  const lg = back(seg(T, 4.9, 5.6), 1.5); $('logo').style.opacity = clamp(lg * 3); $('logo').style.transform = 'translateX(-50%) translateY(' + ((1 - lg) * 40) + 'px) scale(' + (0.9 + 0.1 * lg) + ')';
}
window.draw = draw;
</script></body></html>
