<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:"DM Sans";src:url("__FONT__") format("woff2");font-weight:100 1000}
*{margin:0;padding:0;box-sizing:border-box}
:root{--real:#1a3c8e;--blue:#0f5ced;--sky:#58a6ff;--mist:#f3f6fd;--ink:#0b1e3f}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f3f6fd}
body{font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
#st{position:absolute;inset:0;overflow:hidden;background:var(--mist)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(15,92,237,.10) 2px,transparent 2px),linear-gradient(90deg,rgba(15,92,237,.10) 2px,transparent 2px);background-size:120px 120px}
#top{position:absolute;left:0;top:-640px;width:1080px;height:640px;background:var(--real);overflow:hidden}
#top .grid{background-image:linear-gradient(rgba(255,255,255,.13) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.13) 2px,transparent 2px)}
#glow2{position:absolute;left:-200px;top:-200px;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(88,166,255,.45),rgba(88,166,255,0) 70%)}
.h{position:absolute;left:90px;top:290px;width:900px;font-size:104px;font-weight:600;letter-spacing:-.035em;line-height:1.03;color:#fff}
.h em{font-style:normal;color:var(--sky)}.h .w{display:inline-block;opacity:0;white-space:pre}
#sub{position:absolute;left:90px;top:520px;font-size:38px;color:#dbe6ff;opacity:0}
#chips{position:absolute;left:60px;top:760px;width:960px;display:flex;flex-wrap:wrap;gap:20px 18px;justify-content:center}
.chip{color:#fff;font-size:46px;font-weight:600;letter-spacing:-.01em;padding:22px 38px;border-radius:70px;opacity:0}
#t1{position:absolute;left:0;width:100%;top:1400px;text-align:center;font-size:38px;color:#5f7094;opacity:0}
#t2{position:absolute;left:0;width:100%;top:1452px;text-align:center;font-size:60px;font-weight:700;letter-spacing:-.01em;color:var(--blue);opacity:0}
#logo{position:absolute;left:50%;top:1600px;width:480px;transform:translateX(-50%);opacity:0}
</style></head><body><div id="st"><div class="grid" id="g0"></div>
<div id="top"><div class="grid" id="g1"></div><div id="glow2"></div>
 <div class="h" id="h"><span class="w">Un </span><span class="w">agente </span><span class="w">para</span><br><span class="w"><em>tu rubro.</em></span></div>
 <div id="sub">Contesta, agenda y hace seguimiento.</div></div>
<div id="chips"></div>
<div id="t1">Mira los planes en</div><div id="t2">atacamalabs.cl/precios</div>
<img id="logo" src="__LOGO__">
</div><script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (T, a, b) => clamp((T - a) / (b - a));
const eout = (t) => 1 - Math.pow(1 - t, 3);
const back = (t, s = 1.7) => { t = clamp(t); const c3 = s + 1; return 1 + c3 * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const CH = [['Salud', '#0f5ced', -2], ['Inmobiliarias', '#ff7a59', 2], ['Educación', '#7c5cff', 1], ['Retail & Ecommerce', '#00a99b', -2], ['Alimentación', '#f5a524', 2], ['Gimnasios', '#e5484d', -1], ['Servicios profesionales', '#1a3c8e', 1], ['B2B & Industria', '#2e74f5', -2]];
const els = CH.map(([t, c, r]) => { const d = document.createElement('div'); d.className = 'chip'; d.textContent = t; d.style.background = c; d.style.boxShadow = '0 16px 36px ' + c + '55'; $('chips').append(d); return d; });
function draw(T) {
  const tu = back(seg(T, 0.0, 0.7), 1.2); $('top').style.top = (-640 + 640 * tu) + 'px';
  $('g1').style.backgroundPosition = (-T * 14) + 'px ' + (T * 10) + 'px'; $('g0').style.backgroundPosition = (T * 8) + 'px ' + (-T * 6) + 'px';
  Array.from($('h').querySelectorAll('.w')).forEach((w, i) => { const u = seg(T, 0.4 + i * 0.2, 0.4 + i * 0.2 + 0.5), s = back(u, 1.6); w.style.opacity = clamp(u * 2.5); w.style.transform = 'translateY(' + ((1 - s) * 44) + 'px)'; w.style.filter = u < 1 ? 'blur(' + ((1 - u) * 8) + 'px)' : 'none'; });
  $('sub').style.opacity = eout(seg(T, 1.3, 1.8));
  els.forEach((el, i) => { const t0 = 1.7 + i * 0.28; const u = back(seg(T, t0, t0 + 0.5), 2.0); const fl = T > t0 + 0.8 ? Math.sin(T * 2 + i) * 4 : 0; el.style.opacity = clamp(u * 3); el.style.transform = 'translateY(' + ((1 - u) * 70 + fl) + 'px) scale(' + (0.7 + 0.3 * u) + ') rotate(' + (CH[i][2] * u) + 'deg)'; });
  $('t1').style.opacity = eout(seg(T, 5.0, 5.4));
  const p = back(seg(T, 5.2, 5.85), 1.8); $('t2').style.opacity = clamp(p * 3); $('t2').style.transform = 'scale(' + (0.85 + 0.15 * p) + ')';
  const lg = back(seg(T, 5.7, 6.4), 1.5); $('logo').style.opacity = clamp(lg * 3); $('logo').style.transform = 'translateX(-50%) translateY(' + ((1 - lg) * 40) + 'px) scale(' + (0.9 + 0.1 * lg) + ')';
}
window.draw = draw;
</script></body></html>
