const CK = (off) => '<svg viewBox="0 0 52 52" width="64" height="64"><path d="M14 27 L23 36 L39 17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="40" stroke-dashoffset="' + off + '"/></svg>';
function draw(T) {
  $('g').style.backgroundPosition = (T * 10) + 'px ' + (-T * 8) + 'px';
  $('glow').style.transform = 'translate(' + (Math.sin(T * 0.8) * 30) + 'px,' + (Math.cos(T * 0.8) * 24) + 'px)';
  Array.from($('h').querySelectorAll('.w')).forEach((w, i) => { const u = seg(T, 0.15 + i * 0.16, 0.15 + i * 0.16 + 0.45), s = back(u, 1.6); w.style.opacity = clamp(u * 2.5); w.style.transform = 'translateY(' + ((1 - s) * 44) + 'px)'; w.style.filter = u < 1 ? 'blur(' + ((1 - u) * 8) + 'px)' : 'none'; });
  const m = back(seg(T, 0.7, 1.35), 1.5); $('msg').style.opacity = clamp(m * 3); $('msg').style.transform = 'translateY(' + ((1 - m) * 70) + 'px) scale(' + (0.92 + 0.08 * m) + ')';
  [['c1', 1.6], ['c2', 2.0]].forEach(([id, t0]) => { const u = back(seg(T, t0, t0 + 0.5), 1.5); $(id).style.opacity = clamp(u * 3); $(id).style.transform = 'translateX(' + ((1 - u) * 140) + 'px)'; });
  const k1 = seg(T, 2.05, 2.5); $('i1').style.background = k1 > 0 ? 'var(--teal)' : 'var(--grey)'; $('i1').innerHTML = k1 > 0 ? CK(40 * (1 - eout(k1))) : ''; $('c1').style.borderColor = k1 > 0 ? 'var(--teal)' : 'var(--grey)';
  $('i2').style.background = T > 2.5 ? 'var(--amber)' : 'var(--grey)'; $('i2').innerHTML = T > 2.5 ? '?' : ''; $('c2').style.borderColor = T > 2.5 ? 'var(--amber)' : 'var(--grey)';
  $('i2').style.transform = 'scale(' + (T > 2.7 ? 1 + 0.07 * Math.sin((T - 2.7) * 8) : 1) + ')';
  const wig = (T > 3.4 && T < 4.6) ? Math.sin((T - 3.4) * 26) * 2 : 0; $('c2').style.transform = $('c2').style.transform.split(' rotate')[0] + ' rotate(' + wig + 'deg)';
  const q = back(seg(T, 3.3, 3.95), 1.8); $('q').style.opacity = clamp(q * 3); $('q').style.transform = 'translateY(' + ((1 - q) * 50) + 'px) scale(' + ((0.9 + 0.1 * q) * (T > 4.0 ? 1 + 0.02 * Math.sin((T - 4.0) * 5) : 1)) + ')';
  const lg = back(seg(T, 4.9, 5.6), 1.5); $('logo').style.opacity = clamp(lg * 3); $('logo').style.transform = 'translateX(-50%) translateY(' + ((1 - lg) * 40) + 'px) scale(' + (0.9 + 0.1 * lg) + ')';
}
