<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:"DM Sans";src:url("__FONT__") format("woff2");font-weight:100 1000}
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#0f5ced;--ink:#0b1e3f;--amber:#ffc53d}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f3f6fd}
body{font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
#st{position:absolute;inset:0;overflow:hidden;background:#f3f6fd}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(15,92,237,.10) 2px,transparent 2px),linear-gradient(90deg,rgba(15,92,237,.10) 2px,transparent 2px);background-size:120px 120px}
#glow{position:absolute;left:100px;top:700px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(88,166,255,.30),rgba(88,166,255,0) 66%)}
.h{position:absolute;left:90px;top:260px;width:900px;font-size:100px;font-weight:700;letter-spacing:-.035em;line-height:1.03}
.h .w{display:inline-block;opacity:0;white-space:pre}.h em{font-style:normal;color:var(--blue)}
#logo{position:absolute;left:50%;width:420px;transform:translateX(-50%);opacity:0;top:1640px}
.pl{position:absolute;left:90px;width:900px;border-radius:48px;padding:44px 54px;color:#fff;opacity:0;box-shadow:0 26px 60px rgba(26,60,142,.25)}
.pl .n{font-size:76px;font-weight:700;letter-spacing:-.03em}.pl .s{font-size:42px;margin-top:4px;opacity:.9}
.pl .d{position:absolute;right:54px;top:60px;display:flex;gap:12px}.pl .d i{width:34px;height:34px;border-radius:50%;background:#fff;display:block;opacity:0}
#rec{position:absolute;right:50px;top:-26px;background:var(--amber);color:var(--ink);font-weight:700;font-size:28px;letter-spacing:.1em;padding:10px 26px;border-radius:40px}
#pill{position:absolute;left:50%;top:1520px;transform:translateX(-50%);background:var(--amber);color:var(--ink);font-weight:700;font-size:40px;padding:20px 48px;border-radius:60px;white-space:nowrap;opacity:0}
</style></head><body><div id="st"><div class="grid" id="g"></div><div id="glow"></div>
<div class="h" id="h"><span class="w">Elige </span><span class="w">el </span><span class="w">tamaño</span><br><span class="w">de </span><span class="w">tu </span><span class="w"><em>operación.</em></span></div>
<div class="pl" id="p1" style="top:660px;background:#58a6ff"><div class="n">Esencial</div><div class="s">1 agente</div><div class="d"><i></i></div></div>
<div class="pl" id="p2" style="top:930px;background:#0f5ced"><div id="rec">RECOMENDADO</div><div class="n">Operación</div><div class="s">Hasta 3 agentes</div><div class="d"><i></i><i></i><i></i></div></div>
<div class="pl" id="p3" style="top:1200px;background:#12306f"><div class="n">Escala</div><div class="s">Hasta 5 agentes</div><div class="d"><i></i><i></i><i></i><i></i><i></i></div></div>
<div id="pill">Beneficio octubre · hasta el 31/10</div>
<img id="logo" src="__LOGO__">
</div><script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (T, a, b) => clamp((T - a) / (b - a));
const eout = (t) => 1 - Math.pow(1 - t, 3);
const back = (t, s = 1.7) => { t = clamp(t); const c3 = s + 1; return 1 + c3 * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
function bg(T) { $('g').style.backgroundPosition = (T * 10) + 'px ' + (-T * 8) + 'px'; $('glow').style.transform = 'translate(' + (Math.sin(T * 0.8) * 30) + 'px,' + (Math.cos(T * 0.8) * 24) + 'px)'; }
function words(T, step) { Array.from($('h').querySelectorAll('.w')).forEach((w, i) => { const u = seg(T, 0.15 + i * step, 0.15 + i * step + 0.45), s = back(u, 1.6); w.style.opacity = clamp(u * 2.5); w.style.transform = 'translateY(' + ((1 - s) * 44) + 'px)'; w.style.filter = u < 1 ? 'blur(' + ((1 - u) * 8) + 'px)' : 'none'; }); }
function draw(T) {
  bg(T); words(T, 0.12);
  [['p1', 1.2], ['p2', 1.75], ['p3', 2.3]].forEach(([id, t0], i) => {
    const u = back(seg(T, t0, t0 + 0.55), 1.6); const el = $(id); el.style.opacity = clamp(u * 3); el.style.transform = 'translateX(' + ((1 - u) * (i % 2 ? -200 : 200)) + 'px)';
    Array.from(el.querySelectorAll('.d i')).forEach((d, j) => { const v = back(seg(T, t0 + 0.5 + j * 0.12, t0 + 0.8 + j * 0.12), 2.2); d.style.opacity = clamp(v * 3); d.style.transform = 'scale(' + v + ')'; });
  });
  const pu = back(seg(T, 3.6, 4.2), 1.8); $('pill').style.opacity = clamp(pu * 3); $('pill').style.transform = 'translateX(-50%) scale(' + (0.7 + 0.3 * pu) + ')';
  const lg = back(seg(T, 4.8, 5.4), 1.5); $('logo').style.opacity = clamp(lg * 3); $('logo').style.transform = 'translateX(-50%) translateY(' + ((1 - lg) * 40) + 'px)';
}
window.draw = draw;
</script></body></html>
