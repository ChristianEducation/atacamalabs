<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:"DM Sans";src:url("__FONT__") format("woff2");font-weight:100 1000}
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#0f5ced;--ink:#0b1e3f;--amber:#ffc53d}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f3f6fd}
body{font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
#st{position:absolute;inset:0;overflow:hidden;background:#f3f6fd}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(15,92,237,.10) 2px,transparent 2px),linear-gradient(90deg,rgba(15,92,237,.10) 2px,transparent 2px);background-size:120px 120px}
#glow{position:absolute;left:100px;top:700px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(88,166,255,.30),rgba(88,166,255,0) 66%)}
.h{position:absolute;left:90px;top:230px;width:900px;font-size:96px;font-weight:700;letter-spacing:-.035em;line-height:1.03}
.h .w{display:inline-block;opacity:0;white-space:pre}.h em{font-style:normal;color:var(--blue)}
#logo{position:absolute;left:50%;width:440px;transform:translateX(-50%);opacity:0;top:1560px}
.sub{position:absolute;left:90px;top:575px;width:920px;font-size:36px;white-space:nowrap;color:#5f7094;opacity:0}
#card{position:absolute;left:90px;top:680px;width:900px;background:#fff;border:3px solid #d5e0f6;border-radius:48px;padding:26px 50px;box-shadow:0 26px 60px rgba(26,60,142,.16);opacity:0}
.lab{font-size:28px;font-weight:700;letter-spacing:.14em;color:var(--blue);padding:18px 0 12px}
.it{display:flex;align-items:center;gap:30px;font-size:46px;font-weight:600;letter-spacing:-.01em;padding:30px 0;border-top:2px solid #e6edfa;opacity:0}
.ck{width:64px;height:64px;border-radius:50%;border:4px solid #c3d2f2;flex:none;display:flex;align-items:center;justify-content:center;background:#fff}
.ck svg{width:36px;height:36px;opacity:0}
</style></head><body><div id="st"><div class="grid" id="g"></div><div id="glow"></div>
<div class="h" id="h"><span class="w">Antes </span><span class="w">de </span><span class="w">automatizar,</span><br><span class="w"><em>elige </em></span><span class="w"><em>bien.</em></span></div>
<div class="sub" id="sub">5 preguntas para saber por qué proceso partir.</div>
<div id="card"><div class="lab">CHECKLIST · 10 MINUTOS</div>
<div class="it"><div class="ck"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>Se repite</div>
<div class="it"><div class="ck"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>Tiene reglas claras</div>
<div class="it"><div class="ck"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>Mueves datos a mano</div>
<div class="it"><div class="ck"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>Cuesta tiempo o genera errores</div>
<div class="it"><div class="ck"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>Se puede medir y revisar</div></div>
<img id="logo" src="__LOGO__">
</div><script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (T, a, b) => clamp((T - a) / (b - a));
const eout = (t) => 1 - Math.pow(1 - t, 3);
const back = (t, s = 1.7) => { t = clamp(t); const c3 = s + 1; return 1 + c3 * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
function bg(T) { $('g').style.backgroundPosition = (T * 10) + 'px ' + (-T * 8) + 'px'; $('glow').style.transform = 'translate(' + (Math.sin(T * 0.8) * 30) + 'px,' + (Math.cos(T * 0.8) * 24) + 'px)'; }
function words(T, step) { Array.from($('h').querySelectorAll('.w')).forEach((w, i) => { const u = seg(T, 0.15 + i * step, 0.15 + i * step + 0.45), s = back(u, 1.6); w.style.opacity = clamp(u * 2.5); w.style.transform = 'translateY(' + ((1 - s) * 44) + 'px)'; w.style.filter = u < 1 ? 'blur(' + ((1 - u) * 8) + 'px)' : 'none'; }); }
function draw(T) {
  bg(T); words(T, 0.12);
  $('sub').style.opacity = eout(seg(T, 0.9, 1.4));
  const c = back(seg(T, 1.2, 1.8), 1.5); $('card').style.opacity = clamp(c * 3); $('card').style.transform = 'translateY(' + ((1 - c) * 120) + 'px)';
  Array.from(document.querySelectorAll('.it')).forEach((el, i) => {
    const t0 = 1.9 + i * 0.55; const u = back(seg(T, t0, t0 + 0.4), 1.5); el.style.opacity = clamp(u * 3); el.style.transform = 'translateX(' + ((1 - u) * 60) + 'px)';
    const k = back(seg(T, t0 + 0.35, t0 + 0.7), 2.2); const ck = el.querySelector('.ck');
    ck.style.background = k > 0.05 ? '#0f5ced' : '#fff'; ck.style.borderColor = k > 0.05 ? '#0f5ced' : '#c3d2f2';
    ck.style.transform = 'scale(' + (1 + 0.18 * Math.sin(clamp(k) * Math.PI)) + ')'; ck.querySelector('svg').style.opacity = clamp(k * 3);
  });
  const lg = back(seg(T, 5.6, 6.2), 1.5); $('logo').style.opacity = clamp(lg * 3); $('logo').style.transform = 'translateX(-50%) translateY(' + ((1 - lg) * 40) + 'px)';
}
window.draw = draw;
</script></body></html>
