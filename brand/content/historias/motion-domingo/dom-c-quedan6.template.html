<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:"DM Sans";src:url("__FONT__") format("woff2");font-weight:100 1000}
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#0f5ced;--ink:#0b1e3f;--amber:#ffc53d}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f3f6fd}
body{font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
#st{position:absolute;inset:0;overflow:hidden;background:#f3f6fd}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(15,92,237,.10) 2px,transparent 2px),linear-gradient(90deg,rgba(15,92,237,.10) 2px,transparent 2px);background-size:120px 120px}
#glow{position:absolute;left:100px;top:700px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(88,166,255,.30),rgba(88,166,255,0) 66%)}
.h{position:absolute;left:90px;top:400px;width:900px;font-size:130px;font-weight:700;letter-spacing:-.035em;line-height:1.03}
.h .w{display:inline-block;opacity:0;white-space:pre}
#logo{position:absolute;left:50%;width:420px;transform:translateX(-50%);opacity:0;top:1620px}
#tag{position:absolute;left:90px;top:280px;background:var(--amber);color:var(--ink);font-weight:700;font-size:34px;letter-spacing:.12em;padding:14px 34px;border-radius:60px;opacity:0}
#num{position:absolute;left:80px;top:520px;font-size:520px;font-weight:700;letter-spacing:-.06em;line-height:1;color:var(--blue);opacity:0;display:inline-block}
#dias{position:absolute;left:520px;top:900px;font-size:120px;font-weight:700;letter-spacing:-.03em;opacity:0}
#txt{position:absolute;left:90px;top:1170px;width:900px;font-size:50px;line-height:1.25;color:var(--ink);opacity:0}
#url{position:absolute;left:90px;top:1400px;font-size:62px;font-weight:700;color:var(--blue);letter-spacing:-.02em;opacity:0}
</style></head><body><div id="st"><div class="grid" id="g"></div><div id="glow"></div>
<div id="tag">BENEFICIO OCTUBRE</div>
<div class="h" id="h"><span class="w">Quedan</span></div>
<div id="num">9</div><div id="dias">días</div>
<div id="txt">para contratar y <b>mantener tu mensualidad</b> mientras sigas en el mismo plan.</div>
<div id="url">atacamalabs.cl/precios</div>
<img id="logo" src="__LOGO__">
</div><script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (T, a, b) => clamp((T - a) / (b - a));
const eout = (t) => 1 - Math.pow(1 - t, 3);
const back = (t, s = 1.7) => { t = clamp(t); const c3 = s + 1; return 1 + c3 * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
function bg(T) { $('g').style.backgroundPosition = (T * 10) + 'px ' + (-T * 8) + 'px'; $('glow').style.transform = 'translate(' + (Math.sin(T * 0.8) * 30) + 'px,' + (Math.cos(T * 0.8) * 24) + 'px)'; }
function words(T, step) { Array.from($('h').querySelectorAll('.w')).forEach((w, i) => { const u = seg(T, 0.15 + i * step, 0.15 + i * step + 0.45), s = back(u, 1.6); w.style.opacity = clamp(u * 2.5); w.style.transform = 'translateY(' + ((1 - s) * 44) + 'px)'; w.style.filter = u < 1 ? 'blur(' + ((1 - u) * 8) + 'px)' : 'none'; }); }
function draw(T) {
  bg(T); words(T, 0.12);
  const tg = eout(seg(T, 0.1, 0.5)); $('tag').style.opacity = tg; $('tag').style.transform = 'translateY(' + ((1 - tg) * 30) + 'px)';
  const n = back(seg(T, 0.9, 1.5), 1.7); $('num').style.opacity = clamp(n * 3);
  $('num').textContent = 9 - Math.round(3 * eout(seg(T, 1.2, 2.6)));
  const pop = 1 + 0.08 * Math.sin(seg(T, 2.6, 3.0) * Math.PI);
  $('num').style.transform = 'scale(' + ((0.6 + 0.4 * n) * pop) + ')'; $('num').style.transformOrigin = '30% 60%';
  const d = back(seg(T, 1.5, 2.1), 1.5); $('dias').style.opacity = clamp(d * 3); $('dias').style.transform = 'translateX(' + ((1 - d) * 60) + 'px)';
  const t = back(seg(T, 3.2, 3.8), 1.4); $('txt').style.opacity = clamp(t * 3); $('txt').style.transform = 'translateY(' + ((1 - t) * 40) + 'px)';
  const u = back(seg(T, 4.0, 4.6), 1.4); $('url').style.opacity = clamp(u * 3); $('url').style.transform = 'translateY(' + ((1 - u) * 40) + 'px)';
  const lg = back(seg(T, 4.9, 5.5), 1.5); $('logo').style.opacity = clamp(lg * 3); $('logo').style.transform = 'translateX(-50%) translateY(' + ((1 - lg) * 40) + 'px)';
}
window.draw = draw;
</script></body></html>
