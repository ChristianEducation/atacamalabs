const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (T, a, b) => clamp((T - a) / (b - a));
const eout = (t) => 1 - Math.pow(1 - t, 3);
const back = (t, s = 1.7) => { t = clamp(t); const c3 = s + 1; return 1 + c3 * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const dots = []; for (let i = 0; i < 100; i++) { const d = document.createElement('div'); d.className = 'dot'; d.style.left = ((i % 10) * 64) + 'px'; d.style.top = (Math.floor(i / 10) * 64) + 'px'; $('dots').append(d); dots.push(d); }
// 62 puntos «perdidos» (orden fijo pseudoaleatorio, determinista)
const order = Array.from({ length: 100 }, (_, i) => i).sort((a, b) => ((a * 37) % 101) - ((b * 37) % 101));
const lostSet = order.slice(0, 62); const rank = {}; lostSet.forEach((k, r) => rank[k] = r);
const keep = lostSet.slice(0, 2);
function draw(T) {
