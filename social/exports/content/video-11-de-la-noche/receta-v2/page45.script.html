{ let s = ''; for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6, r1 = 74, r2 = i % 3 === 0 ? 62 : 68; s += '<line x1="' + (Math.sin(a) * r1) + '" y1="' + (-Math.cos(a) * r1) + '" x2="' + (Math.sin(a) * r2) + '" y2="' + (-Math.cos(a) * r2) + '"/>'; } $('hTicks').innerHTML = s; }
{ let s = ''; for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6, r1 = 88, r2 = i % 3 === 0 ? 72 : 80; s += '<line x1="' + (Math.sin(a) * r1) + '" y1="' + (-Math.cos(a) * r1) + '" x2="' + (Math.sin(a) * r2) + '" y2="' + (-Math.cos(a) * r2) + '"/>'; } $('bTicks').innerHTML = s; }
{ let s = ''; for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; s += '<line x1="' + (Math.sin(a) * 58) + '" y1="' + (-Math.cos(a) * 58) + '" x2="' + (Math.sin(a) * 82) + '" y2="' + (-Math.cos(a) * 82) + '"/>'; } $('rays').innerHTML = s; }

const NODES = [

  { id: 'doc',  kind: 'doc',      from: [540, 655], to: [170, 830], size: 175, move: [0.15, 0.95] },

const gNodes = $('nodes'), gLines = $('lines'), gCenter = $('center'), gPulses = $('pulses');

for (const n of NODES) {

  g.append(inner2, inner); gNodes.append(g); nodeEls[n.id] = { g, inner, inner2 };
  const l = document.createElementNS(NS, 'path'); l.setAttribute('pathLength', '1'); l.setAttribute('stroke-dasharray', '1'); gLines.append(l); lineEls[n.id] = l;

for (let i = 0; i < 6; i++) { const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', '13'); c.setAttribute('fill', '#2a5bff'); c.setAttribute('stroke', '#fff'); c.setAttribute('stroke-width', '4'); gPulses.append(c); pulses.push(c); }

const pad2 = (n) => String(n).padStart(2, '0');

function draw(T) {

  $('dawn').style.background = 'linear-gradient(105deg,rgba(255,226,160,0) 20%,rgba(255,222,150,.5) 100%)'; $('dawn').style.opacity = mu;
  $('vig').style.opacity = lerp(1, 0.5, mu);

  ph.style.opacity = T >= t0 ? 1 : 0;

  ph.style.transform = 'translateY(' + (fall + bounce + jy) + 'px) rotate(' + ang + 'deg) scaleY(' + sq + ')';
  phSh.style.left = (1010 - 120) + 'px'; phSh.style.top = (1445 - 20) + 'px'; phSh.style.width = '240px'; phSh.style.height = '42px';
  phSh.style.opacity = T >= t0 ? clamp(0.3 + 0.7 * landU) : 0;

    const a = (0.25 + 0.45 * (0.5 + 0.5 * Math.sin(T * 1.7 + d.ph2))) * (1 - 0.35 * mu);

  bub($('b2'), TM.agent, T); bub($('b3'), TM.done, T);

  $('sheet').style.transform = 'translateY(' + (100 * (1 - sIn) + 100 * sOut) + '%)';
  $('progf').style.width = (lerp(0, 100, (1 + eio(seg(T, TM.step2 - 0.15, TM.step2 + 0.15)) + eio(seg(T, TM.step3 - 0.15, TM.step3 + 0.15))) / 3)) + '%';
  const stepVis = (id, a, b) => { const el = $(id); const o = seg(T, a, a + 0.2) * (1 - seg(T, b - 0.2, b)); el.style.opacity = o; el.style.transform = 'translateX(' + ((1 - seg(T, a, a + 0.25)) * 40 - seg(T, b - 0.25, b) * 40) + 'px)'; };
  stepVis('s1', TM.sheet + 0.15, TM.step2); stepVis('s2', TM.step2, TM.step3); stepVis('s3', TM.step3, 99);
  const sel = (id, on) => { const el = $(id); el.style.borderColor = on ? '#0f5ced' : '#dbe4f5'; el.style.background = on ? '#eaf1fd' : '#fff'; el.querySelector('.rd').style.borderColor = on ? '#0f5ced' : '#b8c5de'; el.querySelector('i').style.opacity = on ? 1 : 0; };
  sel('s1r0', T >= TM.tap1); sel('s2r0', T >= TM.tap2);
  document.querySelectorAll('.step .btn').forEach((b, i) => { if (i < 2) { const on = (i === 0 && T >= TM.tap1) || (i === 1 && T >= TM.tap2); b.style.background = on ? '#1e9d3d' : '#b9dcc2'; } });
  $('s3b').style.transform = 'scale(' + (T >= TM.tap3 && T < TM.tap3 + 0.2 ? 0.94 : 1) + ')';
  tapfx($('tp1'), TM.tap1, T); tapfx($('tp2'), TM.tap2, T); tapfx($('tp3'), TM.tap3, T);
  const c2 = $('cap2'); const cu = seg(T, TM.done + 0.3, TM.done + 0.7); c2.style.opacity = cu; c2.style.transform = 'translateY(' + ((1 - cu) * 20) + 'px)';
  for (let i = 0; i < 3; i++) {
    const r = $('res').children[i]; const tc = TM.cards[i]; const s = pop(T - tc);
    r.style.opacity = T >= tc ? 1 : 0; r.style.transform = 'translateX(' + ((1 - eout(seg(T, tc, tc + 0.35))) * 70) + 'px) scale(' + (0.9 + 0.1 * Math.min(1, s)) + ')';
    const ck = r.querySelector('.ck'); const cs = pop(T - tc - 0.25); ck.style.transform = 'scale(' + Math.min(1.1, cs) + ')'; ck.style.opacity = T >= tc + 0.25 ? 1 : 0;
  }
  const w = $('win'); const wu = seg(T, TM.win, TM.win + 0.45); w.style.opacity = wu; w.style.transform = 'translateY(' + ((1 - eout(wu)) * 30) + 'px)';
  // ===== reloj grande (paso de la noche al día) =====
  const bo = seg(T, TM.spin0, TM.spin0 + 0.35) * (1 - seg(T, TM.spin1 + 0.55, TM.spin1 + 1.05));
  const big = $('big'); big.style.opacity = bo; big.style.display = bo <= 0 ? 'none' : 'block';
  if (bo > 0) {
    const u = eio(seg(T, TM.spin0 + 0.2, TM.spin1)); const hd = lerp(330, 630, u);
    $('bHour').setAttribute('transform', 'rotate(' + hd + ')'); $('bMin').setAttribute('transform', 'rotate(' + (hd * 12) + ')');
    const m = 1387 + 593 * u; const hh = Math.floor(m / 60) % 24, mm = Math.floor(m % 60);
    $('bigLabel').textContent = u >= 0.999 ? '9:00 a. m.' : pad2(hh) + ':' + pad2(mm);
    $('bigClk').style.transform = 'scale(' + (0.8 + 0.2 * Math.min(1, pop(T - TM.spin0))) + ')';
    const sU = T >= TM.spin1 - 0.7 ? pop(T - (TM.spin1 - 0.7)) : 0; const bs = $('bigSun');
    bs.style.opacity = sU > 0 ? 1 : 0; bs.style.transform = 'scale(' + (0.4 + 0.6 * Math.min(1.15, sU)) + ') rotate(' + (T * 40) + 'deg)';

  dv.style.transform = 'scaleY(' + eio(seg(T, TM.splitStart, TM.splitStart + 0.5)) + ')';
  // ===== gancho =====

  $('hClk').style.opacity = seg(T, TM.hookTitle - 0.2, TM.hookTitle + 0.3); $('hClk').style.transform = 'scale(' + (0.7 + 0.3 * Math.min(1, pop(T - TM.hookTitle + 0.2))) + ')';

  const shake = T > TM.hookNotif + 0.4 && T < TM.hookNotif + 0.85 ? Math.sin((T - TM.hookNotif) * 60) * 1.4 * (1 - seg(T, TM.hookNotif + 0.4, TM.hookNotif + 0.85)) : 0;
  $('notif').style.opacity = nu2 > 0 ? 1 : 0; $('notif').style.transform = 'translateY(' + ((1 - nu2) * -420) + 'px) rotate(' + shake + 'deg)';
  const l1 = seg(T, TM.hookText, TM.hookText + 0.45); $('hL1').style.opacity = l1; $('hL1').style.transform = 'translateY(' + ((1 - eout(l1)) * 26) + 'px)';

      const idx = SEQ.indexOf(n.id); const ts = 2.0 + idx * 0.25; const bump = 1 + 0.10 * Math.sin(clamp((t - (ts + 0.2)) / 0.3) * Math.PI) * (t < 3.5 ? 1 : 0);

      els.g.setAttribute('transform', 'translate(' + q[0] + ' ' + q[1] + ') scale(' + (s * n.size / 160) + ') translate(-80 -80)'); els.g.setAttribute('opacity', op);
      if (n.morphFrom) { const m = clamp((t - n.morph[0]) / (n.morph[1] - n.morph[0])); els.inner.setAttribute('opacity', m); els.inner2.setAttribute('opacity', 1 - m); }
      const lp = lineEls[n.id]; const d0 = n.pop === undefined || n.pop === 0 ? 1.2 : n.pop + 0.35; const prog = eio(clamp((t - Math.max(d0, 1.2)) / 0.55)); const fade = 1 - clamp((endU - 0.2) / 0.5);
      lp.setAttribute('d', 'M' + C.x + ' ' + C.y + ' L' + q[0] + ' ' + q[1]); lp.setAttribute('stroke-dashoffset', 1 - prog); lp.setAttribute('opacity', fade * (prog > 0 ? 1 : 0));
